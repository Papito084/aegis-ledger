services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis_postgres
    restart: unless-stopped
    command: >
      postgres
      -c default_transaction_isolation=serializable
      -c wal_level=logical
      -c synchronous_commit=on
      -c full_page_writes=on
      -c max_connections=150
      -c shared_buffers=256MB
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aegis_network

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - aegis_network

  aegis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - DATABASE_URL=postgresql+asyncpg://aegis_user:aegis_password@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - aegis-api
    networks:
      - aegis_network



volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aegis_network:
    driver: bridge
